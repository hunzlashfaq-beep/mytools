<html lang="en">
<head>
<meta charset="UTF-8">
<title>Domain Extractor</title>

<style>
  :root{
    --ink:#1c2b2d;
    --paper:#f6f4ee;
    --line:#d9d3c4;
    --accent:#2f6f5e;
    --accent-ink:#f6f4ee;
    --muted:#7a7568;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    margin:0 0 24px;
  }
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:16px;
  }
  label.field-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:8px;
    text-transform:none;
  }
  textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    background:#fdfcf9;
  }
  textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
  }
  .row{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:9px 16px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  button:hover{border-color:var(--accent);}
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  button.primary:hover{background:#265c4e;}
  button.ghost{
    background:transparent;
    border-color:transparent;
    color:var(--muted);
    padding:9px 4px;
  }
  button.ghost:hover{color:var(--accent);border-color:transparent;background:transparent;}
  .count-line{
    font-size:13px;
    color:var(--muted);
    margin:0 0 14px;
  }
  .count-line strong{color:var(--ink);}
  .tld-filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    margin-bottom:16px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-family:var(--mono);
    color:var(--ink);
    border:1px solid var(--line);
    background:#fdfcf9;
    padding:5px 10px 5px 8px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
  }
  .chip input{accent-color:var(--accent);margin:0;}
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  table{width:100%;border-collapse:collapse;}
  td{
    padding:9px 4px;
    font-family:var(--mono);
    font-size:13px;
    border-bottom:1px solid var(--line);
    word-break:break-all;
  }
  tr:last-child td{border-bottom:none;}
  td.actions{width:34px;text-align:right;}
  .copy-btn{
    background:transparent;
    border:none;
    padding:4px;
    color:var(--muted);
    cursor:pointer;
    border-radius:5px;
  }
  .copy-btn:hover{color:var(--accent);background:#f0ede4;}
  .copy-btn svg{display:block;}
  .empty{
    color:var(--muted);
    font-size:13.5px;
    padding:24px 4px;
    text-align:center;
  }
  .footer-row{
    display:flex;
    justify-content:flex-end;
    margin-top:14px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:9px 16px;
    border-radius:7px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Domain Extractor</h1>
  <p class="sub">Paste text containing URLs or domains. Extracts and de-duplicates hostnames, with filtering by TLD.</p>

  <div class="panel">
    <label class="field-label" for="input">Text</label>
    <textarea id="input" placeholder="Enter text containing domain names here."></textarea>
    <div class="row">
      <button class="primary" id="run">Extract domains</button>
      <button id="sample">Load sample</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <div class="panel" id="results-panel" style="display:none;">
    <p class="count-line" id="count-line"></p>
    <div class="tld-filters" id="tld-filters"></div>
    <table id="table"><tbody id="table-body"></tbody></table>
    <div class="footer-row">
      <button id="copy-all">Copy all shown</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied</div>

<script>
const SAMPLE = `*Daoud SEO Network*
*Self-Author Publishing Access*

https://awsurplusauction.com/
https://lukethewindowcleaner.com/
https://secondskinoveralls.com/
https://kyinsider.com/
https://huskerbigred.com/
https://spartanshadows.com/
https://travelblog.lv/
https://roastbrief.com.mx/
https://www.empowher.com/
https://www.thelascopress.com/
https://www.neverlikeditanyway.com/
https://mundo-nipo.com/
https://www.thetechedvocate.org/
https://baiienatalquran.com/
https://zerofatalities.com/
https://innovativedentalandorthodontics.com/
https://4fund.com
https://wefunder.com/
https://ceo.ca
https://www.kaggle.com
https://b31.org.uk/
https://www.article1.co.uk/
https://www.barcawelt.de
https://www.thenational.com.pg
https://www.thesims3.com`;

const input = document.getElementById('input');
const runBtn = document.getElementById('run');
const sampleBtn = document.getElementById('sample');
const resetBtn = document.getElementById('reset');
const resultsPanel = document.getElementById('results-panel');
const countLine = document.getElementById('count-line');
const tldFiltersEl = document.getElementById('tld-filters');
const tableBody = document.getElementById('table-body');
const copyAllBtn = document.getElementById('copy-all');
const toast = document.getElementById('toast');

let allDomains = [];   // full de-duped list
let activeTlds = new Set(); // empty = show all

function showToast(msg){
  toast.textContent = msg || 'Copied';
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 1300);
}

function extractDomains(text){
  // Matches things like https://sub.example.com/path, www.example.co.uk, plain example.com
  const re = /(?:https?:\/\/)?(?:www\.)?([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+)(?=[\/\s"'<>,)]|$)/gi;
  const found = new Set();
  let m;
  while ((m = re.exec(text)) !== null){
    let host = m[1].toLowerCase();
    // strip trailing dot / punctuation
    host = host.replace(/\.+$/,'').replace(/[.,;:!?]+$/,'');
    // basic sanity: must contain a letter, and a dot, and a plausible TLD (2+ alpha chars at end)
    if(!/^[a-z0-9.-]+$/.test(host)) continue;
    if(!/\.[a-z]{2,}$/.test(host)) continue;
    // filter out things that look like versions/decimals only (require at least one alpha in each label mostly, skip pure numeric hosts like IPs)
    if(/^\d+(\.\d+){3}$/.test(host)) continue;
    found.add(host);
  }
  return Array.from(found).sort((a,b)=>a.localeCompare(b));
}

function getTld(domain){
  const parts = domain.split('.');
  return parts[parts.length-1];
}

function render(){
  const tldCounts = {};
  allDomains.forEach(d=>{
    const t = getTld(d);
    tldCounts[t] = (tldCounts[t]||0)+1;
  });
  const tlds = Object.keys(tldCounts).sort();

  tldFiltersEl.innerHTML = '';
  tlds.forEach(t=>{
    const chip = document.createElement('label');
    chip.className = 'chip' + (activeTlds.has(t) ? ' active' : '');
    chip.innerHTML = `<input type="checkbox" ${activeTlds.has(t)?'checked':''}> ${t} (${tldCounts[t]})`;
    chip.querySelector('input').addEventListener('change', (e)=>{
      if(e.target.checked) activeTlds.add(t); else activeTlds.delete(t);
      render();
    });
    tldFiltersEl.appendChild(chip);
  });

  const shown = allDomains.filter(d => activeTlds.size===0 || activeTlds.has(getTld(d)));

  countLine.innerHTML = `<strong>${allDomains.length}</strong> domain(s) found` +
    (activeTlds.size ? ` — <strong>${shown.length}</strong> shown with selected filter` : '');

  tableBody.innerHTML = '';
  if(shown.length===0){
    tableBody.innerHTML = `<tr><td colspan="2"><div class="empty">No domains match the current filter.</div></td></tr>`;
  } else {
    shown.forEach(d=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${d}</td><td class="actions"><button class="copy-btn" title="Copy" aria-label="Copy">${copyIcon()}</button></td>`;
      tr.querySelector('.copy-btn').addEventListener('click', ()=>{
        navigator.clipboard.writeText(d).then(()=>showToast('Copied '+d));
      });
      tableBody.appendChild(tr);
    });
  }

  copyAllBtn.onclick = () => {
    navigator.clipboard.writeText(shown.join('\n')).then(()=>showToast(`Copied ${shown.length} domain(s)`));
  };

  resultsPanel.style.display = 'block';
}

function copyIcon(){
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>`;
}

runBtn.addEventListener('click', ()=>{
  allDomains = extractDomains(input.value);
  activeTlds = new Set();
  render();
});

sampleBtn.addEventListener('click', ()=>{
  input.value = SAMPLE;
});

resetBtn.addEventListener('click', ()=>{
  input.value = '';
  allDomains = [];
  activeTlds = new Set();
  resultsPanel.style.display = 'none';
});
</script>
</body>
</html>
