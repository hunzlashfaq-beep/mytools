<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline — Task Timer</title>
  <!-- Favicon using SVG data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='5' width='90' height='90' rx='12' fill='%2315140F' stroke='%23E8A33D' stroke-width='3'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='48' font-weight='bold' fill='%23E8A33D' text-anchor='middle'%3E⏱%3C/text%3E%3C/svg%3E">
  <!-- Fallback PNG favicon for older browsers -->
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAACXBIWXMAAAsTAAALEwEAmpwYAAABOUlEQVR4nO3bsUoDQRAG4I8r01hZWIh9EAsfIj7CTTCNBbKFhVj7BqKQ5zB5j3toGyIEFMLG4Bty7SXwE0+TJf9abpjdud2dGe6DE7a2tra2trb+hz6PZEdr3iQ/0jV9ki2ty5LvlNND8tH9q1u6tpsnuZM9XacvQ1LhTubU7mpcl0mFm92sK1+FTbtUkzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzAMwzC899NENW4qkl9pI9+55//laT3Rxf9sHbXxsJ+dn+mvyXs0hWEYhmEYxkl/ABU/1md8/TJbAAAAAElFTkSuQmCC">
  <style>
    :root{
      --bg:#15140F;
      --panel:#1B1A13;
      --line:#33321F;
      --text:#EDE7D8;
      --muted:#8B8873;
      --amber:#E8A33D;
      --warn:#C8563C;
      --done:#7C9473;
      --drag-handle:#55503A;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      min-height:100vh;
      padding:48px 24px 96px;
    }
    .wrap{max-width:640px;margin:0 auto;}

    .head{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      border-bottom:1px solid var(--line);
      padding-bottom:16px;
      margin-bottom:32px;
      flex-wrap:wrap;
      gap:8px;
    }
    .head h1{
      font-size:20px;
      font-weight:600;
      letter-spacing:0.02em;
      margin:0;
    }
    .head .stats{
      display:flex;
      gap:16px;
      font-size:13px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
      flex-wrap:wrap;
    }
    .head .stats b{color:var(--amber);font-weight:600;}
    .head .stats .saved-time b{color:var(--done);}

    .hero{
      display:none;
      background:var(--panel);
      border:1px solid var(--line);
      border-left:3px solid var(--amber);
      padding:28px 24px;
      margin-bottom:32px;
    }
    .hero.active{display:block;}
    .hero.warning{border-left-color:var(--warn);}
    .hero-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }
    .hero-name{
      font-size:17px;
      margin-bottom:14px;
      color:var(--text);
    }
    .hero-time{
      font-family:"SF Mono","JetBrains Mono",Consolas,monospace;
      font-variant-numeric:tabular-nums;
      font-size:56px;
      font-weight:600;
      letter-spacing:0.02em;
      color:var(--amber);
      line-height:1;
    }
    .hero.warning .hero-time{color:var(--warn);}
    .hero-controls{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .add-form{
      display:flex;
      gap:8px;
      margin-bottom:32px;
      flex-wrap:wrap;
    }
    .add-form input[type="text"]{
      flex:1;
      min-width:160px;
    }
    .add-form input,
    .add-form select{
      background:var(--panel);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      font-size:14px;
      font-family:inherit;
    }
    .add-form input:focus,
    .add-form select:focus{
      outline:none;
      border-color:var(--amber);
    }
    .time-inputs{
      display:flex;
      align-items:center;
      gap:4px;
      background:var(--panel);
      border:1px solid var(--line);
      padding:0 8px;
    }
    .time-inputs input{
      background:transparent;
      border:none;
      width:38px;
      text-align:center;
      padding:10px 0;
      font-variant-numeric:tabular-nums;
    }
    .time-inputs input:focus{outline:none;}
    .time-inputs span{color:var(--muted);font-size:13px;}

    button{
      font-family:inherit;
      font-size:13px;
      cursor:pointer;
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      padding:10px 16px;
      transition:border-color .15s ease, color .15s ease;
    }
    button:hover{border-color:var(--amber);}
    button.primary{
      background:var(--amber);
      border-color:var(--amber);
      color:#15140F;
      font-weight:600;
    }
    button.primary:hover{opacity:0.9;}
    button.ghost{color:var(--muted);border-color:transparent;padding:10px 8px;}
    button.ghost:hover{color:var(--warn);border-color:transparent;}
    button.small{padding:7px 12px;font-size:12px;}
    button.done-btn{background:var(--done);border-color:var(--done);color:#15140F;}
    button.done-btn:hover{opacity:0.85;}
    .task-extra{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}

    .queue-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:10px;
    }
    .task-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 0;
      border-bottom:1px solid var(--line);
      flex-wrap:wrap;
      cursor:grab;
      transition:background 0.2s, opacity 0.2s;
      position:relative;
    }
    .task-row:active{cursor:grabbing;}
    .task-row.dragging{
      opacity:0.4;
      background:var(--panel);
      border:2px solid var(--amber);
    }
    .task-row.drag-over{
      border-bottom:2px solid var(--amber);
    }
    .task-row.done{
      opacity:0.5;
      cursor:default;
    }
    .task-row.done .drag-handle{
      opacity:0.2;
      cursor:default;
    }
    .task-main{
      flex:1;
      min-width:120px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .drag-handle{
      color:var(--drag-handle);
      font-size:18px;
      cursor:grab;
      user-select:none;
      padding:0 4px;
      flex-shrink:0;
      line-height:1;
    }
    .drag-handle:active{cursor:grabbing;}
    .task-row.done .drag-handle{color:var(--line);}
    .task-name{
      font-size:15px;
      margin-bottom:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .task-row.done .task-name{text-decoration:line-through;}
    .task-meta{
      font-size:12px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
    .task-meta.is-active{color:var(--amber);}
    .task-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
      flex-wrap:wrap;
      align-items:center;
    }
    .task-content{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .empty{
      color:var(--muted);
      font-size:14px;
      padding:24px 0;
      text-align:center;
      border:1px dashed var(--line);
    }

    ::selection{background:var(--amber);color:#15140F;}
  </style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Discipline</h1>
    <div class="stats">
      <span class="completed-count"><b id="doneCount">0</b> completed today</span>
      <span class="saved-time">⏱ saved <b id="savedTime">0s</b></span>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-label">Now running</div>
    <div class="hero-name" id="heroName">—</div>
    <div class="hero-time" id="heroTime">00:00</div>
    <div class="hero-controls">
      <button class="small" id="pauseBtn">Pause</button>
      <button class="small ghost" id="resetActiveBtn">Reset</button>
      <button class="small" id="addFiveBtn">+5 min</button>
      <span id="extraCounter" style="font-size:12px;color:var(--muted);margin-left:4px;"></span>
    </div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="taskName" placeholder="Task name" required>
    <div class="time-inputs">
      <input type="number" id="taskMin" min="0" max="180" value="25" inputmode="numeric">
      <span>min</span>
      <input type="number" id="taskSec" min="0" max="59" value="0" inputmode="numeric">
      <span>sec</span>
    </div>
    <button type="submit" class="primary">Add task</button>
  </form>

  <div class="queue-label">Today's queue <span style="color:var(--muted);font-weight:normal;">(drag to reorder)</span></div>
  <div id="taskList"></div>
  <div class="empty" id="emptyState" style="display:none;">No tasks yet. Add one above and hit Start.</div>

</div>

<script>
(function(){
  const STORAGE_KEY = 'discipline_tasks_v2';
  const DATE_KEY = 'discipline_date_v2';
  const ORDER_KEY = 'discipline_order_v2';

  let tasks = [];
  let activeId = null;
  let intervalHandle = null;
  let extraMinutesUsed = 0;
  let lastTickTime = null;
  let timerRunning = false;
  let isDragging = false;
  let draggedId = null;
  let notificationQueue = [];
  let isProcessingNotifications = false;

  const el = {
    hero: document.getElementById('hero'),
    heroName: document.getElementById('heroName'),
    heroTime: document.getElementById('heroTime'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetActiveBtn: document.getElementById('resetActiveBtn'),
    addFiveBtn: document.getElementById('addFiveBtn'),
    extraCounter: document.getElementById('extraCounter'),
    addForm: document.getElementById('addForm'),
    taskName: document.getElementById('taskName'),
    taskMin: document.getElementById('taskMin'),
    taskSec: document.getElementById('taskSec'),
    taskList: document.getElementById('taskList'),
    emptyState: document.getElementById('emptyState'),
    doneCount: document.getElementById('doneCount'),
    savedTime: document.getElementById('savedTime'),
  };

  // --- persistence & daily reset ---
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }

  function load(){
    const savedDate = localStorage.getItem(DATE_KEY);
    const raw = localStorage.getItem(STORAGE_KEY);
    tasks = raw ? JSON.parse(raw) : [];
    if (savedDate !== todayStr()){
      tasks = tasks.map(t => ({...t, remaining: t.total, done:false, warned:false, halfwayAnnounced:false}));
      localStorage.setItem(DATE_KEY, todayStr());
      save();
    }
    // Load order if exists
    const orderRaw = localStorage.getItem(ORDER_KEY);
    if (orderRaw) {
      const order = JSON.parse(orderRaw);
      tasks.forEach(t => {
        if (order[t.id] !== undefined) {
          t.order = order[t.id];
        }
      });
    }
    // Ensure all tasks have order
    tasks.forEach((t, i) => {
      if (t.order === undefined) t.order = i;
    });
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    // Save order
    const order = {};
    tasks.forEach(t => { order[t.id] = t.order; });
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }

  // --- sort tasks: active on top, then by order, completed at bottom ---
  function getSortedTasks(){
    const active = tasks.find(t => t.id === activeId && !t.done);
    const sorted = [...tasks].sort((a, b) => {
      // Active task always first
      if (a.id === activeId && !a.done) return -1;
      if (b.id === activeId && !b.done) return 1;
      // Completed tasks go to the bottom
      if (a.done && !b.done) return 1;
      if (!a.done && b.done) return -1;
      // Then by order
      return (a.order || 0) - (b.order || 0);
    });
    return sorted;
  }

  // --- calculate total saved time ---
  function getTotalSavedTime(){
    return tasks.reduce((total, t) => {
      if (t.done) {
        return total + Math.max(0, t.total - t.remaining);
      }
      return total;
    }, 0);
  }

  // --- format time for display ---
  function formatTime(seconds){
    seconds = Math.round(seconds);
    if (seconds < 60) {
      return `${seconds}s`;
    } else if (seconds < 3600) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
    } else {
      const hours = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
    }
  }

  // --- sound with background support ---
  let audioCtx = null;
  function ensureAudioContext(){
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // Resume if suspended (browser suspends audio in background)
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    } catch(e) {
      return null;
    }
  }

  function beep(freq, duration, delay, gainVal){
    try {
      const c = ensureAudioContext();
      if (!c) return;
      
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = gainVal || 0.15;
      osc.connect(gain);
      gain.connect(c.destination);
      const startAt = c.currentTime + (delay || 0);
      osc.start(startAt);
      osc.stop(startAt + duration);
    } catch(e) {
      // Fallback: try to play using Web Audio with user gesture
      try {
        const c = ensureAudioContext();
        if (c && c.state === 'running') {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.value = gainVal || 0.15;
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(c.currentTime + (delay || 0));
          osc.stop(c.currentTime + (delay || 0) + duration);
        }
      } catch(e2) {}
    }
  }

  function playWarningSound(){
    beep(660, 0.15, 0);
    beep(660, 0.15, 0.25);
  }

  function playCompleteSound(){
    const pattern = [523, 659, 784];
    const totalDuration = 5.2;
    const cycleLength = 0.55;
    let t = 0;
    let i = 0;
    while (t < totalDuration){
      beep(pattern[i % pattern.length], 0.3, t, 0.16);
      t += cycleLength;
      i++;
    }
  }

  // --- speech with background support ---
  let speechSynthesis = window.speechSynthesis;
  let cachedVoices = [];

  function loadVoices(){
    if (speechSynthesis) {
      cachedVoices = speechSynthesis.getVoices() || [];
    }
  }

  if (speechSynthesis){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickMaleVoice(){
    if (!cachedVoices.length) return null;
    const englishVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = englishVoices.length ? englishVoices : cachedVoices;
    const maleHints = ['male','david','mark','daniel','alex','fred','tom','james','george','ryan'];
    let match = pool.find(v => maleHints.some(h => v.name.toLowerCase().includes(h)));
    return match || pool[0];
  }

  function speak(text){
    if (!speechSynthesis) return;
    
    // Cancel any ongoing speech
    try {
      speechSynthesis.cancel();
    } catch(e) {}
    
    try {
      const utter = new SpeechSynthesisUtterance(text);
      const voice = pickMaleVoice();
      if (voice) utter.voice = voice;
      utter.pitch = 0.8;
      utter.rate = 1;
      utter.volume = 1;
      
      // Try to speak - this works even in background
      speechSynthesis.speak(utter);
    } catch(e) {}
  }

  function playHalfwaySound(taskName){
    speak('50% of time reached. Make sure to complete ' + taskName + ' within your deadline time.');
  }

  // --- Notification queue system ---
  function queueNotification(type, data){
    notificationQueue.push({ type, data, timestamp: Date.now() });
    processNotificationQueue();
  }

  function processNotificationQueue(){
    if (isProcessingNotifications || notificationQueue.length === 0) return;
    
    isProcessingNotifications = true;
    
    // Process all queued notifications
    const queue = [...notificationQueue];
    notificationQueue = [];
    
    queue.forEach(item => {
      switch(item.type) {
        case 'warning':
          playWarningSound();
          break;
        case 'halfway':
          playHalfwaySound(item.data.taskName);
          break;
        case 'complete':
          playCompleteSound();
          speak(`Task ${item.data.taskName} completed! Well done.`);
          break;
        case 'saved':
          speak(item.data.message);
          break;
      }
    });
    
    isProcessingNotifications = false;
    
    // Process any new notifications that came in while processing
    if (notificationQueue.length > 0) {
      processNotificationQueue();
    }
  }

  // --- formatting ---
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  // --- timer engine (timestamp based) ---
  function processTimer(){
    const t = tasks.find(x => x.id === activeId);
    if (!t || !t.running) return;

    const now = Date.now();
    if (lastTickTime === null) {
      lastTickTime = now;
      return;
    }

    const elapsed = (now - lastTickTime) / 1000;
    lastTickTime = now;

    if (elapsed <= 0) return;

    const oldRemaining = t.remaining;
    const newRemaining = Math.max(0, t.remaining - elapsed);
    t.remaining = newRemaining;

    // Check for notifications that might have been missed
    checkNotifications(t, oldRemaining, newRemaining);

    if (t.remaining <= 0) {
      t.remaining = 0;
      t.running = false;
      t.done = true;
      timerRunning = false;
      stopInterval();
      // Queue completion notification
      queueNotification('complete', { taskName: t.name });
      activeId = null;
      extraMinutesUsed = 0;
    }

    render();
  }

  function checkNotifications(t, oldRemaining, newRemaining){
    const halfway = Math.floor(t.total / 2);
    
    // Check halfway (we crossed the halfway point)
    if (oldRemaining > halfway && newRemaining <= halfway && halfway > 0 && !t.halfwayAnnounced) {
      t.halfwayAnnounced = true;
      queueNotification('halfway', { taskName: t.name });
    }

    // Check 5-minute warning (we crossed 5 minutes)
    if (oldRemaining > 300 && newRemaining <= 300 && !t.warned) {
      t.warned = true;
      queueNotification('warning', {});
    }
  }

  function tick(){
    processTimer();
  }

  function startInterval(){
    stopInterval();
    lastTickTime = Date.now();
    timerRunning = true;
    intervalHandle = setInterval(tick, 500);
  }

  function stopInterval(){
    if (intervalHandle){ 
      clearInterval(intervalHandle); 
      intervalHandle = null; 
    }
    timerRunning = false;
  }

  // --- render ---
  function render(){
    const active = tasks.find(t => t.id === activeId);

    // hero
    if (active){
      el.hero.classList.add('active');
      el.hero.classList.toggle('warning', active.remaining <= 300 && active.remaining > 0);
      el.heroName.textContent = active.name;
      el.heroTime.textContent = fmt(active.remaining);
      el.pauseBtn.textContent = active.running ? 'Pause' : 'Resume';
      const used = active.extraMinutesAdded || 0;
      el.extraCounter.textContent = used >= 15 ? 'max +15 min' : (used > 0 ? `+${used} min` : '');
    } else {
      el.hero.classList.remove('active','warning');
      el.extraCounter.textContent = '';
    }

    // Update stats
    const completedCount = tasks.filter(t => t.done).length;
    const totalSaved = getTotalSavedTime();
    el.doneCount.textContent = completedCount;
    el.savedTime.textContent = formatTime(totalSaved);

    // list - sorted with active on top, completed at bottom
    const sorted = getSortedTasks();
    el.taskList.innerHTML = '';
    el.emptyState.style.display = tasks.length ? 'none' : 'block';

    sorted.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '');
      row.dataset.taskId = t.id;
      row.draggable = !t.done;

      const main = document.createElement('div');
      main.className = 'task-main';

      // Drag handle
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder';
      if (!t.done) {
        main.appendChild(handle);
      }

      const content = document.createElement('div');
      content.className = 'task-content';
      
      const name = document.createElement('div');
      name.className = 'task-name';
      name.textContent = t.name;
      
      const meta = document.createElement('div');
      meta.className = 'task-meta' + (t.id === activeId ? ' is-active' : '');
      if (t.done) {
        const saved = Math.max(0, t.total - t.remaining);
        meta.textContent = `Done ✅ · saved ${fmt(saved)}`;
      } else {
        meta.textContent = fmt(t.remaining) + ' remaining of ' + fmt(t.total);
      }
      
      content.appendChild(name);
      content.appendChild(meta);
      main.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      if (!t.done){
        const startBtn = document.createElement('button');
        startBtn.className = 'small' + (t.id === activeId ? ' primary' : '');
        startBtn.textContent = t.id === activeId ? (t.running ? 'Running' : 'Resume') : 'Start';
        startBtn.onclick = (e) => {
          e.stopPropagation();
          startTask(t.id);
        };
        actions.appendChild(startBtn);

        const doneBtn = document.createElement('button');
        doneBtn.className = 'small done-btn';
        doneBtn.textContent = '✔ Done';
        doneBtn.onclick = (e) => {
          e.stopPropagation();
          completeTask(t.id);
        };
        actions.appendChild(doneBtn);

        if (t.id === activeId && active) {
          const addBtn = document.createElement('button');
          addBtn.className = 'small';
          addBtn.textContent = '+5m';
          addBtn.onclick = (e) => {
            e.stopPropagation();
            addFiveMinutes(t.id);
          };
          actions.appendChild(addBtn);
        }
      }

      const resetBtn = document.createElement('button');
      resetBtn.className = 'small ghost';
      resetBtn.textContent = 'Reset';
      resetBtn.onclick = (e) => {
        e.stopPropagation();
        resetTask(t.id);
      };
      actions.appendChild(resetBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'small ghost';
      delBtn.textContent = 'Delete';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteTask(t.id);
      };
      actions.appendChild(delBtn);

      row.appendChild(main);
      row.appendChild(actions);

      // Drag events - only if not done
      if (!t.done) {
        row.addEventListener('dragstart', handleDragStart);
        row.addEventListener('dragend', handleDragEnd);
        row.addEventListener('dragover', handleDragOver);
        row.addEventListener('dragenter', handleDragEnter);
        row.addEventListener('dragleave', handleDragLeave);
        row.addEventListener('drop', handleDrop);
      }

      el.taskList.appendChild(row);
    });

    save();
  }

  // --- Drag and drop ---
  function handleDragStart(e) {
    const row = e.target.closest('.task-row');
    if (!row) return;
    const id = row.dataset.taskId;
    const task = tasks.find(t => t.id === id);
    if (task && task.done) {
      e.preventDefault();
      return;
    }
    isDragging = true;
    draggedId = id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', id);
  }

  function handleDragEnd(e) {
    const row = e.target.closest('.task-row');
    if (row) row.classList.remove('dragging');
    document.querySelectorAll('.task-row').forEach(r => r.classList.remove('drag-over'));
    isDragging = false;
    draggedId = null;
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('.task-row');
    if (row) {
      row.classList.add('drag-over');
    }
  }

  function handleDragEnter(e) {
    e.preventDefault();
  }

  function handleDragLeave(e) {
    const row = e.target.closest('.task-row');
    if (row) {
      row.classList.remove('drag-over');
    }
  }

  function handleDrop(e) {
    e.preventDefault();
    const row = e.target.closest('.task-row');
    if (!row) return;
    row.classList.remove('drag-over');
    
    const targetId = row.dataset.taskId;
    if (!draggedId || draggedId === targetId) return;

    const draggedTask = tasks.find(t => t.id === draggedId);
    const targetTask = tasks.find(t => t.id === targetId);
    
    if (!draggedTask || !targetTask || draggedTask.done || targetTask.done) return;

    // Don't allow dragging active task
    if (draggedTask.id === activeId || targetTask.id === activeId) return;

    // Get current order
    const sorted = [...tasks].filter(t => !t.done).sort((a, b) => (a.order || 0) - (b.order || 0));
    const dragIndex = sorted.findIndex(t => t.id === draggedId);
    const targetIndex = sorted.findIndex(t => t.id === targetId);
    
    if (dragIndex === -1 || targetIndex === -1) return;

    // Remove dragged item from array
    sorted.splice(dragIndex, 1);
    // Insert at target position
    sorted.splice(targetIndex, 0, draggedTask);

    // Update orders
    sorted.forEach((t, i) => {
      t.order = i;
    });

    draggedId = null;
    isDragging = false;
    render();
  }

  // --- Task actions ---
  function startTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    
    // Pause all others
    tasks.forEach(task => { 
      if (task.id !== id) task.running = false; 
    });
    
    if (activeId !== id) {
      extraMinutesUsed = 0;
      // Reset notification flags when switching tasks
      t.warned = false;
      t.halfwayAnnounced = false;
    }
    
    t.running = true;
    activeId = id;
    lastTickTime = Date.now();
    startInterval();
    render();
  }

  function togglePauseActive(){
    const t = tasks.find(x => x.id === activeId);
    if (!t) return;
    t.running = !t.running;
    if (t.running) {
      lastTickTime = Date.now();
      startInterval();
    } else {
      stopInterval();
    }
    render();
  }

  function resetTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.remaining = t.total;
    t.done = false;
    t.warned = false;
    t.halfwayAnnounced = false;
    t.extraMinutesAdded = 0;
    if (t.id === activeId){ 
      t.running = false; 
      stopInterval(); 
      activeId = null; 
      extraMinutesUsed = 0;
      timerRunning = false;
    }
    render();
  }

  function deleteTask(id){
    if (id === activeId){ 
      stopInterval(); 
      activeId = null; 
      extraMinutesUsed = 0;
      timerRunning = false;
    }
    tasks = tasks.filter(t => t.id !== id);
    // Reorder remaining active tasks
    const activeTasks = tasks.filter(t => !t.done).sort((a, b) => (a.order || 0) - (b.order || 0));
    activeTasks.forEach((t, i) => { t.order = i; });
    render();
  }

  function completeTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    t.done = true;
    t.running = false;
    if (t.id === activeId) {
      stopInterval();
      activeId = null;
      extraMinutesUsed = 0;
      timerRunning = false;
    }
    const saved = Math.max(0, t.total - t.remaining);
    const savedMin = Math.floor(saved / 60);
    const savedSec = Math.round(saved % 60);
    let msg = `Task ${t.name} completed. You saved `;
    if (savedMin > 0) msg += `${savedMin} minute${savedMin>1?'s':''} `;
    if (savedSec > 0) msg += `${savedSec} second${savedSec>1?'s':''}`;
    msg += '. Well done.';
    
    // Queue the saved message
    queueNotification('saved', { message: msg });
    render();
  }

  function addFiveMinutes(id){
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    if (t.id !== activeId) return;
    const used = t.extraMinutesAdded || 0;
    if (used >= 15) {
      speak('Maximum extra time reached. You cannot add more than 15 minutes.');
      return;
    }
    const add = 5;
    const newUsed = Math.min(used + add, 15);
    const actualAdd = newUsed - used;
    t.remaining += actualAdd * 60;
    t.total += actualAdd * 60;
    t.extraMinutesAdded = newUsed;
    extraMinutesUsed = newUsed;
    speak(`Added ${actualAdd} minutes. Total extra ${newUsed} minutes.`);
    render();
  }

  // --- add form ---
  el.addForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = el.taskName.value.trim();
    const min = parseInt(el.taskMin.value || '0', 10);
    const sec = parseInt(el.taskSec.value || '0', 10);
    const total = Math.max(1, min*60 + sec);
    if (!name) return;

    // Find max order among active tasks (not done)
    const activeTasks = tasks.filter(t => !t.done);
    const maxOrder = activeTasks.reduce((max, t) => Math.max(max, t.order || 0), -1);
    
    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name: name,
      total: total,
      remaining: total,
      running: false,
      done: false,
      warned: false,
      halfwayAnnounced: false,
      extraMinutesAdded: 0,
      order: maxOrder + 1
    });

    el.taskName.value = '';
    el.taskName.focus();
    render();
  });

  // --- hero controls ---
  el.pauseBtn.addEventListener('click', togglePauseActive);
  el.resetActiveBtn.addEventListener('click', function(){
    if (activeId) resetTask(activeId);
  });
  el.addFiveBtn.addEventListener('click', function(){
    if (activeId) addFiveMinutes(activeId);
  });

  // --- Visibility API: resume timer when tab becomes visible ---
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && timerRunning) {
      const t = tasks.find(x => x.id === activeId);
      if (t && t.running) {
        lastTickTime = Date.now();
        processTimer();
      }
    }
  });

  // --- User interaction to resume audio context ---
  document.addEventListener('click', function() {
    ensureAudioContext();
  });
  document.addEventListener('touchstart', function() {
    ensureAudioContext();
  });

  // --- init ---
  load();
  const wasRunning = tasks.find(t => t.running);
  if (wasRunning){
    activeId = wasRunning.id;
    lastTickTime = Date.now();
    startInterval();
    extraMinutesUsed = wasRunning.extraMinutesAdded || 0;
    timerRunning = true;
  }
  render();
})();
</script>
</body>
</html>
