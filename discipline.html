<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline — Task Timer</title>
  <style>
    :root{
      --bg:#15140F;
      --panel:#1B1A13;
      --line:#33321F;
      --text:#EDE7D8;
      --muted:#8B8873;
      --amber:#E8A33D;
      --warn:#C8563C;
      --done:#7C9473;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      min-height:100vh;
      padding:48px 24px 96px;
    }
    .wrap{max-width:640px;margin:0 auto;}

    .head{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      border-bottom:1px solid var(--line);
      padding-bottom:16px;
      margin-bottom:32px;
    }
    .head h1{
      font-size:20px;
      font-weight:600;
      letter-spacing:0.02em;
      margin:0;
    }
    .head .tally{
      font-size:13px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
    .head .tally b{color:var(--amber);font-weight:600;}

    .hero{
      display:none;
      background:var(--panel);
      border:1px solid var(--line);
      border-left:3px solid var(--amber);
      padding:28px 24px;
      margin-bottom:32px;
    }
    .hero.active{display:block;}
    .hero.warning{border-left-color:var(--warn);}
    .hero-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }
    .hero-name{
      font-size:17px;
      margin-bottom:14px;
      color:var(--text);
    }
    .hero-time{
      font-family:"SF Mono","JetBrains Mono",Consolas,monospace;
      font-variant-numeric:tabular-nums;
      font-size:56px;
      font-weight:600;
      letter-spacing:0.02em;
      color:var(--amber);
      line-height:1;
    }
    .hero.warning .hero-time{color:var(--warn);}
    .hero-controls{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .add-form{
      display:flex;
      gap:8px;
      margin-bottom:32px;
      flex-wrap:wrap;
    }
    .add-form input[type="text"]{
      flex:1;
      min-width:160px;
    }
    .add-form input,
    .add-form select{
      background:var(--panel);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      font-size:14px;
      font-family:inherit;
    }
    .add-form input:focus,
    .add-form select:focus{
      outline:none;
      border-color:var(--amber);
    }
    .time-inputs{
      display:flex;
      align-items:center;
      gap:4px;
      background:var(--panel);
      border:1px solid var(--line);
      padding:0 8px;
    }
    .time-inputs input{
      background:transparent;
      border:none;
      width:38px;
      text-align:center;
      padding:10px 0;
      font-variant-numeric:tabular-nums;
    }
    .time-inputs input:focus{outline:none;}
    .time-inputs span{color:var(--muted);font-size:13px;}

    button{
      font-family:inherit;
      font-size:13px;
      cursor:pointer;
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      padding:10px 16px;
      transition:border-color .15s ease, color .15s ease;
    }
    button:hover{border-color:var(--amber);}
    button.primary{
      background:var(--amber);
      border-color:var(--amber);
      color:#15140F;
      font-weight:600;
    }
    button.primary:hover{opacity:0.9;}
    button.ghost{color:var(--muted);border-color:transparent;padding:10px 8px;}
    button.ghost:hover{color:var(--warn);border-color:transparent;}
    button.small{padding:7px 12px;font-size:12px;}
    button.done-btn{background:var(--done);border-color:var(--done);color:#15140F;}
    button.done-btn:hover{opacity:0.85;}
    .task-extra{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}

    .queue-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:10px;
    }
    .task-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 0;
      border-bottom:1px solid var(--line);
      flex-wrap:wrap;
    }
    .task-row.done{opacity:0.45;}
    .task-main{flex:1;min-width:120px;}
    .task-name{
      font-size:15px;
      margin-bottom:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .task-row.done .task-name{text-decoration:line-through;}
    .task-meta{
      font-size:12px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
    .task-meta.is-active{color:var(--amber);}
    .task-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
      flex-wrap:wrap;
      align-items:center;
    }

    .empty{
      color:var(--muted);
      font-size:14px;
      padding:24px 0;
      text-align:center;
      border:1px dashed var(--line);
    }

    ::selection{background:var(--amber);color:#15140F;}
  </style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Discipline</h1>
    <div class="tally"><b id="doneCount">0</b> completed today</div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-label">Now running</div>
    <div class="hero-name" id="heroName">—</div>
    <div class="hero-time" id="heroTime">00:00</div>
    <div class="hero-controls">
      <button class="small" id="pauseBtn">Pause</button>
      <button class="small ghost" id="resetActiveBtn">Reset</button>
      <button class="small" id="addFiveBtn">+5 min</button>
      <span id="extraCounter" style="font-size:12px;color:var(--muted);margin-left:4px;"></span>
    </div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="taskName" placeholder="Task name" required>
    <div class="time-inputs">
      <input type="number" id="taskMin" min="0" max="180" value="25" inputmode="numeric">
      <span>min</span>
      <input type="number" id="taskSec" min="0" max="59" value="0" inputmode="numeric">
      <span>sec</span>
    </div>
    <button type="submit" class="primary">Add task</button>
  </form>

  <div class="queue-label">Today's queue</div>
  <div id="taskList"></div>
  <div class="empty" id="emptyState" style="display:none;">No tasks yet. Add one above and hit Start.</div>

</div>

<script>
(function(){
  const STORAGE_KEY = 'discipline_tasks_v1';
  const DATE_KEY = 'discipline_date_v1';

  let tasks = [];
  let activeId = null;
  let intervalHandle = null;
  // track extra minutes added (per active task)
  let extraMinutesUsed = 0;     // reset when task changes

  const el = {
    hero: document.getElementById('hero'),
    heroName: document.getElementById('heroName'),
    heroTime: document.getElementById('heroTime'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetActiveBtn: document.getElementById('resetActiveBtn'),
    addFiveBtn: document.getElementById('addFiveBtn'),
    extraCounter: document.getElementById('extraCounter'),
    addForm: document.getElementById('addForm'),
    taskName: document.getElementById('taskName'),
    taskMin: document.getElementById('taskMin'),
    taskSec: document.getElementById('taskSec'),
    taskList: document.getElementById('taskList'),
    emptyState: document.getElementById('emptyState'),
    doneCount: document.getElementById('doneCount'),
  };

  // --- persistence & daily reset ---
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }

  function load(){
    const savedDate = localStorage.getItem(DATE_KEY);
    const raw = localStorage.getItem(STORAGE_KEY);
    tasks = raw ? JSON.parse(raw) : [];
    if (savedDate !== todayStr()){
      tasks = tasks.map(t => ({...t, remaining: t.total, done:false, warned:false, halfwayAnnounced:false}));
      localStorage.setItem(DATE_KEY, todayStr());
      save();
    }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  // --- sound ---
  let audioCtx = null;
  function ctx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function beep(freq, duration, delay, gainVal){
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = gainVal || 0.15;
    osc.connect(gain);
    gain.connect(c.destination);
    const startAt = c.currentTime + (delay || 0);
    osc.start(startAt);
    osc.stop(startAt + duration);
  }
  function playWarningSound(){
    beep(660, 0.15, 0);
    beep(660, 0.15, 0.25);
  }
  function playCompleteSound(){
    const pattern = [523, 659, 784];
    const totalDuration = 5.2;
    const cycleLength = 0.55;
    let t = 0;
    let i = 0;
    while (t < totalDuration){
      beep(pattern[i % pattern.length], 0.3, t, 0.16);
      t += cycleLength;
      i++;
    }
  }

  // --- speech ---
  let cachedVoices = [];
  function loadVoices(){
    cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickMaleVoice(){
    if (!cachedVoices.length) return null;
    const englishVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = englishVoices.length ? englishVoices : cachedVoices;
    const maleHints = ['male','david','mark','daniel','alex','fred','tom','james','george','ryan'];
    let match = pool.find(v => maleHints.some(h => v.name.toLowerCase().includes(h)));
    return match || pool[0];
  }
  function speak(text){
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickMaleVoice();
    if (voice) utter.voice = voice;
    utter.pitch = 0.8;
    utter.rate = 1;
    utter.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }
  function playHalfwaySound(taskName){
    speak('50% of time reached. Make sure to complete ' + taskName + ' within your deadline time.');
  }

  // --- formatting ---
  function fmt(sec){
    sec = Math.max(0, sec);
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  // --- render ---
  function render(){
    const active = tasks.find(t => t.id === activeId);

    // hero
    if (active){
      el.hero.classList.add('active');
      el.hero.classList.toggle('warning', active.remaining <= 300 && active.remaining > 0);
      el.heroName.textContent = active.name;
      el.heroTime.textContent = fmt(active.remaining);
      el.pauseBtn.textContent = active.running ? 'Pause' : 'Resume';
      // extra minutes counter
      const used = active.extraMinutesAdded || 0;
      el.extraCounter.textContent = used >= 15 ? 'max +15 min' : (used > 0 ? `+${used} min` : '');
    } else {
      el.hero.classList.remove('active','warning');
      el.extraCounter.textContent = '';
    }

    // list
    el.taskList.innerHTML = '';
    el.emptyState.style.display = tasks.length ? 'none' : 'block';

    tasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '');

      const main = document.createElement('div');
      main.className = 'task-main';
      const name = document.createElement('div');
      name.className = 'task-name';
      name.textContent = t.name;
      const meta = document.createElement('div');
      meta.className = 'task-meta' + (t.id === activeId ? ' is-active' : '');
      if (t.done) {
        meta.textContent = `Done ✅ · saved ${fmt(t.total - t.remaining)}`;
      } else {
        meta.textContent = fmt(t.remaining) + ' remaining of ' + fmt(t.total);
      }
      main.appendChild(name);
      main.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      if (!t.done){
        // start button
        const startBtn = document.createElement('button');
        startBtn.className = 'small' + (t.id === activeId ? ' primary' : '');
        startBtn.textContent = t.id === activeId ? (t.running ? 'Running' : 'Resume') : 'Start';
        startBtn.onclick = () => startTask(t.id);
        actions.appendChild(startBtn);

        // "Done" button: mark as complete, save time
        const doneBtn = document.createElement('button');
        doneBtn.className = 'small done-btn';
        doneBtn.textContent = '✔ Done';
        doneBtn.onclick = () => completeTask(t.id);
        actions.appendChild(doneBtn);

        // +5 min (only for active task)
        if (t.id === activeId && active) {
          const addBtn = document.createElement('button');
          addBtn.className = 'small';
          addBtn.textContent = '+5m';
          addBtn.onclick = () => addFiveMinutes(t.id);
          actions.appendChild(addBtn);
        }
      }

      const resetBtn = document.createElement('button');
      resetBtn.className = 'small ghost';
      resetBtn.textContent = 'Reset';
      resetBtn.onclick = () => resetTask(t.id);
      actions.appendChild(resetBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'small ghost';
      delBtn.textContent = 'Delete';
      delBtn.onclick = () => deleteTask(t.id);
      actions.appendChild(delBtn);

      row.appendChild(main);
      row.appendChild(actions);
      el.taskList.appendChild(row);
    });

    el.doneCount.textContent = tasks.filter(t => t.done).length;
    save();
  }

  // --- timer engine ---
  function tick(){
    const t = tasks.find(x => x.id === activeId);
    if (!t || !t.running) return;

    t.remaining -= 1;

    const halfway = Math.floor(t.total / 2);
    if (t.remaining === halfway && halfway > 0 && !t.halfwayAnnounced){
      t.halfwayAnnounced = true;
      playHalfwaySound(t.name);
    }

    if (t.remaining === 300 && !t.warned){
      t.warned = true;
      playWarningSound();
    }

    if (t.remaining <= 0){
      t.remaining = 0;
      t.running = false;
      t.done = true;
      stopInterval();
      playCompleteSound();
      activeId = null;
      extraMinutesUsed = 0;
    }

    render();
  }

  function startInterval(){
    stopInterval();
    intervalHandle = setInterval(tick, 1000);
  }
  function stopInterval(){
    if (intervalHandle){ clearInterval(intervalHandle); intervalHandle = null; }
  }

  function startTask(id){
    tasks.forEach(t => { if (t.id !== id) t.running = false; });
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    // reset extra minutes counter when switching task
    if (activeId !== id) {
      extraMinutesUsed = 0;
    }
    t.running = true;
    activeId = id;
    startInterval();
    render();
  }

  function togglePauseActive(){
    const t = tasks.find(x => x.id === activeId);
    if (!t) return;
    t.running = !t.running;
    if (t.running) startInterval(); else stopInterval();
    render();
  }

  function resetTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.remaining = t.total;
    t.done = false;
    t.warned = false;
    t.halfwayAnnounced = false;
    t.extraMinutesAdded = 0;
    if (t.id === activeId){ t.running = false; stopInterval(); activeId = null; extraMinutesUsed = 0; }
    render();
  }

  function deleteTask(id){
    if (id === activeId){ stopInterval(); activeId = null; extraMinutesUsed = 0; }
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  // --- complete task (done) ---
  function completeTask(id){
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    t.done = true;
    t.running = false;
    if (t.id === activeId) {
      stopInterval();
      activeId = null;
      extraMinutesUsed = 0;
    }
    // speech: announce saved time
    const saved = t.total - t.remaining;
    const savedMin = Math.floor(saved / 60);
    const savedSec = saved % 60;
    let msg = `Task ${t.name} completed. You saved `;
    if (savedMin > 0) msg += `${savedMin} minute${savedMin>1?'s':''} `;
    if (savedSec > 0) msg += `${savedSec} second${savedSec>1?'s':''}`;
    msg += '. Well done.';
    speak(msg);
    render();
  }

  // --- +5 minutes (max +15 total per task) ---
  function addFiveMinutes(id){
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;
    if (t.id !== activeId) return; // only for active task
    const used = t.extraMinutesAdded || 0;
    if (used >= 15) {
      speak('Maximum extra time reached. You cannot add more than 15 minutes.');
      return;
    }
    const add = 5;
    const newUsed = Math.min(used + add, 15);
    const actualAdd = newUsed - used;
    t.remaining += actualAdd * 60;
    t.total += actualAdd * 60;
    t.extraMinutesAdded = newUsed;
    extraMinutesUsed = newUsed;
    // speech feedback
    speak(`Added ${actualAdd} minutes. Total extra ${newUsed} minutes.`);
    render();
  }

  // --- add form ---
  el.addForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = el.taskName.value.trim();
    const min = parseInt(el.taskMin.value || '0', 10);
    const sec = parseInt(el.taskSec.value || '0', 10);
    const total = Math.max(1, min*60 + sec);
    if (!name) return;

    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name: name,
      total: total,
      remaining: total,
      running: false,
      done: false,
      warned: false,
      halfwayAnnounced: false,
      extraMinutesAdded: 0
    });

    el.taskName.value = '';
    el.taskName.focus();
    render();
  });

  // --- hero controls ---
  el.pauseBtn.addEventListener('click', togglePauseActive);
  el.resetActiveBtn.addEventListener('click', function(){
    if (activeId) resetTask(activeId);
  });
  el.addFiveBtn.addEventListener('click', function(){
    if (activeId) addFiveMinutes(activeId);
  });

  // --- init ---
  load();
  const wasRunning = tasks.find(t => t.running);
  if (wasRunning){
    activeId = wasRunning.id;
    startInterval();
    // restore extra counter
    extraMinutesUsed = wasRunning.extraMinutesAdded || 0;
  }
  render();
})();
</script>
</body>
</html>
